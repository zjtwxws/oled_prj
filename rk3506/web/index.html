<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLED 三级联动控制系统</title>
<style>
  :root{--bg:#1a1a2e;--panel:#16213e;--accent:#0f3460;--text:#e8e8e8;--green:#4caf50;--red:#f44336;--blue:#2196F3;--amber:#ff9800}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  .header{background:var(--panel);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--accent)}
  .header h1{font-size:1.2rem}
  .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .status-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
  .status-dot.off{background:var(--red);box-shadow:0 0 6px var(--red)}
  .container{display:flex;flex:1;gap:16px;padding:16px;overflow:hidden}
  .sidebar{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
  .panel{background:var(--panel);border-radius:8px;padding:14px}
  .panel h3{font-size:0.85rem;color:#8ab4f8;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--accent)}
  .main-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px}
  .oled-preview{border:3px solid #888;border-radius:4px;image-rendering:pixelated;width:512px;height:256px}
  .btn-group{display:flex;gap:6px;flex-wrap:wrap}
  .btn{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:0.8rem;color:#fff;transition:opacity 0.2s}
  .btn:hover{opacity:0.8}
  .btn-green{background:var(--green)}
  .btn-red{background:var(--red)}
  .btn-blue{background:var(--blue)}
  .btn-amber{background:var(--amber)}
  .mode-radio{display:flex;flex-wrap:wrap;gap:4px}
  .mode-radio label{display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;padding:4px 8px;border-radius:4px;background:var(--accent);transition:background 0.2s}
  .mode-radio label:hover,.mode-radio label.active{background:var(--blue)}
  .mode-radio input{display:none}
  .inp{width:100%;padding:6px 8px;border:1px solid var(--accent);border-radius:4px;background:#0a0a1a;color:var(--text);font-size:0.8rem}
  .inp:focus{outline:none;border-color:var(--blue)}
  .log-area{max-height:120px;overflow-y:auto;font-size:0.7rem;font-family:monospace;background:#0a0a1a;padding:8px;border-radius:4px;color:#aaa}
  .led-status{font-size:1.5rem;font-weight:bold}
  .led-status.on{color:var(--green)}
  .led-status.off{color:#666}
  .led-status.blink{color:var(--amber)}
</style>
</head>
<body>

<div class="header">
  <h1>🔗 OLED 三级联动控制系统</h1>
  <div>
    <span class="status-dot off" id="dot"></span>
    <span id="statusText">未连接</span>
  </div>
</div>

<div class="container">
  <!-- 左侧控制面板 -->
  <div class="sidebar">

    <div class="panel">
      <h3>🔌 连接管理</h3>
      <input class="inp" id="ipInput" placeholder="192.168.x.x" value="192.168.1.100">
      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-blue" onclick="connect()">连接</button>
        <button class="btn btn-red" onclick="disconnect()">断开</button>
      </div>
    </div>

    <div class="panel">
      <h3>💡 LED 控制</h3>
      <div class="led-status off" id="ledState">● 关闭</div>
      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-green" onclick="send({cmd:'led',data:{state:1}})">开</button>
        <button class="btn btn-red" onclick="send({cmd:'led',data:{state:0}})">关</button>
        <button class="btn btn-amber" onclick="send({cmd:'led',data:{state:2}})">闪烁</button>
      </div>
    </div>

    <div class="panel">
      <h3>🎬 显示模式</h3>
      <div class="mode-radio" id="modeGroup">
        <label class="active"><input type="radio" name="mode" value="0" checked onchange="send({cmd:'mode',data:{mode:0}})">静态</label>
        <label><input type="radio" name="mode" value="1" onchange="send({cmd:'mode',data:{mode:1}})">左滚</label>
        <label><input type="radio" name="mode" value="2" onchange="send({cmd:'mode',data:{mode:2}})">右滚</label>
        <label><input type="radio" name="mode" value="3" onchange="send({cmd:'mode',data:{mode:3}})">上滚</label>
        <label><input type="radio" name="mode" value="4" onchange="send({cmd:'mode',data:{mode:4}})">下滚</label>
        <label><input type="radio" name="mode" value="5" onchange="send({cmd:'mode',data:{mode:5}})">翻页</label>
        <label><input type="radio" name="mode" value="6" onchange="send({cmd:'mode',data:{mode:6}})">淡入</label>
      </div>
    </div>

    <div class="panel">
      <h3>✏️ 文字输入</h3>
      <input class="inp" id="textInput" placeholder="输入要显示的文字...">
      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-blue" onclick="send({cmd:'text',data:{content:getVal('textInput')}})">发送</button>
      </div>
    </div>

    <div class="panel">
      <h3>🏠 上电默认文字</h3>
      <input class="inp" id="bootTextInput" placeholder="欢迎进入系统">
      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-amber" onclick="send({cmd:'boot_text',data:{content:getVal('bootTextInput')}})">保存到Flash</button>
      </div>
    </div>

    <div class="panel">
      <h3>🌤️ 天气模拟</h3>
      <select class="inp" id="weatherType">
        <option value="0">☀️ 晴</option><option value="1">⛅ 多云</option>
        <option value="2">☁️ 阴</option><option value="3">🌧️ 小雨</option>
        <option value="4">⛈️ 大雨</option><option value="5">🌩️ 雷雨</option>
        <option value="6">❄️ 雪</option>
      </select>
      <div class="btn-group" style="margin-top:8px">
        <input class="inp" id="tempInput" placeholder="温度(℃)" value="26" style="width:60px">
        <input class="inp" id="humInput" placeholder="湿度(%)" value="65" style="width:60px">
      </div>
      <div class="btn-group" style="margin-top:4px">
        <select class="inp" id="windInput" style="width:80px">
          <option value="0">北</option><option value="1">东北</option><option value="2">东</option><option value="3">东南</option>
          <option value="4">南</option><option value="5">西南</option><option value="6">西</option><option value="7">西北</option>
        </select>
        <button class="btn btn-green" onclick="sendWeather()">更新</button>
      </div>
    </div>

    <div class="panel">
      <h3>📋 按键事件日志</h3>
      <div class="log-area" id="logArea">等待事件...</div>
    </div>
  </div>

  <!-- 右侧 OLED 预览 -->
  <div class="main-content">
    <canvas class="oled-preview" id="oledCanvas" width="512" height="256"></canvas>
    <p style="font-size:0.7rem;color:#666;margin-top:-8px">OLED 实时预览 (128×64, 4x 放大)</p>
  </div>
</div>

<script>
  let ws = null;
  let connected = false;
  const canvas = document.getElementById('oledCanvas');
  const ctx = canvas.getContext('2d');

  /* OLED 显存模拟 (128×64/8=1024 字节) */
  const oledBuf = new Uint8Array(1024);

  function getVal(id){return document.getElementById(id).value;}
  function setStatus(txt,on){document.getElementById('statusText').textContent=txt;
    const d=document.getElementById('dot');d.className='status-dot '+(on?'on':'off');}

  function connect(){
    const ip=getVal('ipInput');
    try{ws=new WebSocket('ws://'+ip+'/ws');
      ws.onopen=()=>{connected=true;setStatus('已连接 ✓',true);log('已连接到 '+ip)};
      ws.onclose=()=>{connected=false;setStatus('断开',false);log('连接断开')};
      ws.onerror=()=>{setStatus('异常',false)};
      ws.onmessage=e=>handleMsg(e.data);
    }catch(e){log('连接失败: '+e.message)}
  }

  function disconnect(){if(ws){ws.close();ws=null}}

  function send(obj){
    if(!connected){log('⚠ 未连接');return}
    ws.send(JSON.stringify(obj));
  }

  function sendWeather(){
    send({cmd:'weather',data:{type:parseInt(getVal('weatherType')),temp:parseInt(getVal('tempInput')),
      humidity:parseInt(getVal('humInput')),wind:parseInt(getVal('windInput'))}});
  }

  function handleMsg(data){
    try{const m=JSON.parse(data);
      if(m.evt==='led_status')updateLed(m.data.state);
      if(m.evt==='mode_status')updateMode(m.data.mode);
      if(m.evt==='key_event')log('按键'+m.data.key+':'+m.data.action);
      if(m.evt==='error')log('❌ 错误码:'+m.data.code);
    }catch(e){}
  }

  function updateLed(s){
    const el=document.getElementById('ledState');
    const states=['off','on','blink'];
    const labels=['● 关闭','● 开启','◉ 闪烁'];
    el.className='led-status '+states[s];
    el.textContent=labels[s];
  }

  function updateMode(m){
    const labels=document.querySelectorAll('#modeGroup label');
    labels.forEach((l,i)=>{
      l.classList.toggle('active',i===m);
      l.querySelector('input').checked=(i===m);
    });
  }

  function log(msg){
    const el=document.getElementById('logArea');
    const time=new Date().toLocaleTimeString();
    el.innerHTML='['+time+'] '+msg+'\n'+el.innerHTML;
    const lines=el.innerHTML.split('\n');
    if(lines.length>50)el.innerHTML=lines.slice(0,50).join('\n');
  }

  /* OLED Canvas 预览绘制 */
  function drawOLED(){
    const scaleX=512/128;
    const scaleY=256/64;
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(0,0,512,256);
    ctx.fillStyle='#33ff33';

    for(let y=0;y<64;y++){
      for(let x=0;x<128;x++){
        const page=Math.floor(y/8);
        const bit=y%8;
        if(oledBuf[page*128+x]&(1<<bit)){
          ctx.fillRect(x*scaleX,y*scaleY,scaleX,scaleY);
        }
      }
    }
  }

  /* 模拟 OLED Buffer (演示用 — 显示 "欢迎进入系统") */
  function drawDemo(){
    /* 在 Canvas 上直接用文字模拟 OLED 显示 */
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,512,256);
    ctx.fillStyle='#33ff33';
    ctx.font='24px monospace';
    /* 顶部状态栏 */
    ctx.font='14px monospace';ctx.fillStyle='#888';
    const t=new Date();
    ctx.fillText(`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}  ☀ 晴 26°C`,16,28);
    /* 分割线 */
    ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(0,32);ctx.lineTo(512,32);ctx.stroke();
    /* 主内容 */
    ctx.font='28px monospace';ctx.fillStyle='#33ff33';
    ctx.fillText('欢迎进入系统',30,90);
    ctx.font='18px monospace';ctx.fillStyle='#3a3';
    ctx.fillText('OLED 三级联动',40,130);
    /* 底部 */
    ctx.font='12px monospace';ctx.fillStyle='#666';
    ctx.fillText('LED:● 模式:静态',16,248);
  }

  /* 初始绘制 */
  drawDemo();
  setInterval(drawDemo,1000); /* 每秒刷新预览 */
</script>
</body>
</html>
